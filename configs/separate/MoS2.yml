# MoS2 材料分解配置（统一格式）
material: MoS2
description: "仿真二硫化钼(MoS2)材料分解"

runtime:
  gpu: 0

sampling:
  batch_size: 1
  T_sampling: 200
  time_travel:
    enable: true
    travel_length: 1
    travel_repeat: 1

separation:
  num_layers: 2
  method: separate_sum
  eta: 0.85
  sigma_y: 0.
  simplified: true
  adaptive_superposition: false  # 自适应叠加
  fixed_superposition_k: 1 # 固定叠加系数
  residual_debug: false  # 残差调试日志

processing:
  auto_crop:
    enabled: false
    unit_size_range: [1.5, 3.0]
  sliding_window: true   # 设为 false 可禁用滑窗（加快推理，但可能出现边缘效应）

  # # 指定处理的文件列表（可选）
  # selected_files:
  #   - "MoS2_3R_high_quality_2.5x2.5.png"

paths:
  model_checkpoint: "models/checkpoints/MoS2/ema_0.9999_200000.pt"
  default_input: "data/examples/MoS2"
  default_output: "outputs/separation/MoS2"
